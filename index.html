<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Interactive Quiz Arena</title>
    <!-- Tailwind CSS for modern responsive UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js for reactive state management -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans" x-data="quizApp()">

    <!-- Header / Logo Bar -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center shadow-lg sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <button @click="handleLogoClick" class="focus:outline-none transform hover:scale-105 transition" title="Tap to login as Admin">
                <div class="bg-gradient-to-tr from-indigo-600 to-purple-600 text-white font-bold h-10 w-10 rounded-xl flex items-center justify-center shadow-md text-lg">
                    ⚡
                </div>
            </button>
            <div>
                <h1 class="text-lg font-bold tracking-wide">Live Quiz Arena</h1>
                <p class="text-xs text-slate-400" x-text="isAdmin ? 'Mode: Administrator' : 'Mode: Participant'"></p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <template x-if="isAdmin">
                <div class="flex items-center space-x-2">
                    <button @click="currentView = 'participant'" :class="currentView === 'participant' ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-300'" class="px-3 py-1.5 text-xs rounded-lg font-semibold transition">Participant Board</button>
                    <button @click="currentView = 'admin'" :class="currentView === 'admin' ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-300'" class="px-3 py-1.5 text-xs rounded-lg font-semibold transition">Admin Dashboard</button>
                    <button @click="logoutAdmin" class="bg-red-600/80 hover:bg-red-600 text-white px-3 py-1.5 text-xs rounded-lg font-semibold transition">Logout</button>
                </div>
            </template>
            <template x-if="!isAdmin && participantName">
                <button @click="resetParticipant" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 text-xs rounded-lg transition text-slate-300">Change Name</button>
            </template>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow p-4 max-w-5xl w-full mx-auto flex flex-col justify-center">

        <!-- 1. Participant Registration Screen -->
        <template x-if="!isAdmin && !participantName">
            <div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl shadow-2xl max-w-md mx-auto text-center w-full">
                <div class="text-4xl mb-3">🎮</div>
                <h2 class="text-2xl font-bold mb-2">Join Quiz Session</h2>
                <p class="text-sm text-slate-400 mb-6">Enter your display name to participate.</p>
                <input type="text" x-model="tempName" @keyup.enter="joinAsParticipant" placeholder="Your Name..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 mb-4 focus:outline-none focus:border-indigo-500">
                <button @click="joinAsParticipant" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition shadow-lg">Enter Arena</button>
            </div>
        </template>

        <!-- KICKED OUT SCREEN -->
        <template x-if="isEliminated && !isAdmin">
            <div class="bg-red-950/40 border border-red-800 p-8 rounded-2xl shadow-2xl max-w-md mx-auto text-center space-y-4">
                <div class="text-5xl">❌</div>
                <h2 class="text-2xl font-bold text-red-400">You Have Been Eliminated</h2>
                <p class="text-sm text-slate-300">You exceeded the maximum allowed wrong answers set by the administrator.</p>
            </div>
        </template>

        <!-- 2. Participant View Board -->
        <template x-if="(isAdmin || participantName) && (!isEliminated || isAdmin) && (currentView === 'participant' || !isAdmin)">
            <div class="space-y-6 w-full">
                
                <!-- Active Published Question Display -->
                <template x-if="activeQuestion">
                    <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl space-y-6">
                        <div class="flex justify-between items-center border-b border-slate-700/60 pb-4">
                            <span class="text-xs uppercase tracking-wider bg-indigo-500/20 text-indigo-400 px-3 py-1 rounded-md font-bold" x-text="activeQuestion.type"></span>
                            <span class="text-sm font-mono font-bold" :class="timer <= 5 ? 'text-red-400 animate-pulse' : 'text-amber-400'" x-text="timer > 0 ? `⏳ ${timer}s remaining` : '⏰ Time Ended!'"></span>
                        </div>

                        <h3 class="text-xl font-bold text-slate-100" x-text="activeQuestion.text"></h3>

                        <!-- Multiple Choice / True-False -->
                        <template x-if="['mc', 'tf'].includes(activeQuestion.type)">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                <template x-for="(opt, idx) in activeQuestion.options" :key="idx">
                                    <button @click="selectMcOption(idx)" 
                                        :disabled="hasSubmitted || timer <= 0"
                                        :class="{
                                            'bg-slate-700 hover:bg-slate-600 border-slate-600': !hasSubmitted && timer > 0,
                                            'bg-indigo-600 border-indigo-500 text-white': selectedMcOption === idx,
                                            'opacity-50 cursor-not-allowed': hasSubmitted || timer <= 0
                                        }"
                                        class="border p-4 rounded-xl text-left font-semibold transition flex justify-between items-center" x-text="opt">
                                    </button>
                                </template>
                            </div>
                        </template>

                        <!-- Identification -->
                        <template x-if="activeQuestion.type === 'identification'">
                            <div class="space-y-3">
                                <input type="text" x-model="identificationInput" :disabled="hasSubmitted || timer <= 0" placeholder="Type your answer here..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500 disabled:opacity-50">
                            </div>
                        </template>

                        <!-- Ordering Sequence -->
                        <template x-if="activeQuestion.type === 'order'">
                            <div class="space-y-2">
                                <p class="text-xs text-slate-400 mb-2">Arrange items in correct order using ▲ / ▼ arrows:</p>
                                <template x-for="(item, idx) in userOrder" :key="idx">
                                    <div class="flex items-center justify-between bg-slate-900 border border-slate-700 p-3 rounded-xl">
                                        <span class="font-medium text-sm" x-text="`${idx + 1}. ${item}`"></span>
                                        <div class="flex space-x-1" x-show="!hasSubmitted && timer > 0">
                                            <button @click="moveOrder(idx, -1)" :disabled="idx === 0" class="px-2 py-1 bg-slate-700 rounded hover:bg-slate-600 text-xs disabled:opacity-30">▲</button>
                                            <button @click="moveOrder(idx, 1)" :disabled="idx === userOrder.length - 1" class="px-2 py-1 bg-slate-700 rounded hover:bg-slate-600 text-xs disabled:opacity-30">▼</button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <!-- Submit Button -->
                        <template x-if="!hasSubmitted">
                            <button @click="submitAnswer" :disabled="timer <= 0" class="w-full bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 font-bold py-3 rounded-xl transition shadow-lg">Submit Answer</button>
                        </template>

                        <!-- Immediate Feedback -->
                        <template x-if="hasSubmitted">
                            <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-700 text-center space-y-2">
                                <p class="text-emerald-400 font-bold text-sm">✓ Answer Submitted!</p>
                                
                                <template x-if="adminSettings.showImmediateResult">
                                    <p class="font-semibold text-md" :class="lastAnswerCorrect ? 'text-emerald-400' : 'text-red-400'" x-text="lastAnswerCorrect ? '🎉 Correct Answer!' : '❌ Incorrect Answer!'"></p>
                                </template>

                                <template x-if="!adminSettings.showImmediateResult">
                                    <p class="text-xs text-slate-400 italic">Results hidden by administrator.</p>
                                </template>
                            </div>
                        </template>

                        <!-- Count only indicator -->
                        <template x-if="adminSettings.showCountOnly">
                            <div class="bg-indigo-950/40 border border-indigo-800/60 p-3 rounded-xl text-center">
                                <p class="text-xs text-indigo-300">Total Participants Correct: <span class="font-bold text-sm text-indigo-200" x-text="correctCount"></span></p>
                            </div>
                        </template>
                    </div>
                </template>

                <template x-if="!activeQuestion">
                    <div class="bg-slate-800 border border-slate-700 p-12 rounded-2xl shadow-xl text-center space-y-3">
                        <div class="text-4xl">⏳</div>
                        <h3 class="text-lg font-bold">Waiting for Next Question</h3>
                        <p class="text-sm text-slate-400">The administrator will publish a question shortly.</p>
                    </div>
                </template>

                <!-- Leaderboard Card -->
                <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl space-y-4">
                    <div class="flex justify-between items-center">
                        <h4 class="font-bold text-md flex items-center space-x-2">
                            <span>🏆 Leaderboard</span>
                        </h4>
                        <span class="text-xs text-slate-400" x-text="adminSettings.showScoreboard ? (adminSettings.maskNames ? 'Anonymized View' : 'Full Names View') : 'Hidden by Admin'"></span>
                    </div>

                    <template x-if="adminSettings.showScoreboard || isAdmin">
                        <div class="space-y-2">
                            <template x-for="(scoreData, name) in scores" :key="name">
                                <div class="flex justify-between items-center bg-slate-900 px-4 py-2.5 rounded-xl border border-slate-800">
                                    <span class="font-semibold text-sm" x-text="formatName(name)"></span>
                                    <span class="font-mono font-bold text-indigo-400" x-text="scoreData.score + ' pts'"></span>
                                </div>
                            </template>
                            <template x-if="Object.keys(scores).length === 0">
                                <p class="text-sm text-slate-500 text-center py-2">No scores recorded yet.</p>
                            </template>
                        </div>
                    </template>

                    <template x-if="!adminSettings.showScoreboard && !isAdmin">
                        <p class="text-sm text-slate-500 italic text-center py-4">Scoreboard is currently hidden by the administrator.</p>
                    </template>
                </div>
            </div>
        </template>

        <!-- 3. Admin Dashboard View -->
        <template x-if="isAdmin && currentView === 'admin'">
            <div class="space-y-8 w-full py-4">
                
                <!-- Admin Live Controls -->
                <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl space-y-4">
                    <h3 class="text-lg font-bold text-indigo-400 border-b border-slate-700 pb-2">⚙️ Admin Live Controls</h3>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 text-xs">
                        <div class="bg-slate-900 p-3.5 rounded-xl border border-slate-700 flex justify-between items-center">
                            <div>
                                <p class="font-bold">Show Immediate Answer Feedback</p>
                                <p class="text-slate-400 text-[10px]">Let participants know if answer was right/wrong</p>
                            </div>
                            <input type="checkbox" x-model="adminSettings.showImmediateResult" @change="saveAdminSettings" class="h-4 w-4 rounded accent-indigo-600">
                        </div>

                        <div class="bg-slate-900 p-3.5 rounded-xl border border-slate-700 flex justify-between items-center">
                            <div>
                                <p class="font-bold">Show Correct Count Only</p>
                                <p class="text-slate-400 text-[10px]">Displays total number of correct participants</p>
                            </div>
                            <input type="checkbox" x-model="adminSettings.showCountOnly" @change="saveAdminSettings" class="h-4 w-4 rounded accent-indigo-600">
                        </div>

                        <div class="bg-slate-900 p-3.5 rounded-xl border border-slate-700 flex justify-between items-center">
                            <div>
                                <p class="font-bold">Show Scoreboard</p>
                                <p class="text-slate-400 text-[10px]">Make leaderboard visible to all</p>
                            </div>
                            <input type="checkbox" x-model="adminSettings.showScoreboard" @change="saveAdminSettings" class="h-4 w-4 rounded accent-indigo-600">
                        </div>

                        <div class="bg-slate-900 p-3.5 rounded-xl border border-slate-700 space-y-2">
                            <div class="flex justify-between items-center">
                                <p class="font-bold">Anonymize / Mask Names</p>
                                <input type="checkbox" x-model="adminSettings.maskNames" @change="saveAdminSettings" class="h-4 w-4 rounded accent-indigo-600">
                            </div>
                            <select x-model="adminSettings.maskMode" @change="saveAdminSettings" :disabled="!adminSettings.maskNames" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-xs">
                                <option value="questionMarks">Mask with '??'</option>
                                <option value="initial">Initial Letter Only (e.g. A***)</option>
                                <option value="firstTwo">First 2 Letters (e.g. Ed***)</option>
                                <option value="lengthOnly">Name Length (e.g. 6 letters)</option>
                            </select>
                        </div>

                        <div class="bg-slate-900 p-3.5 rounded-xl border border-slate-700 space-y-2">
                            <div class="flex justify-between items-center">
                                <p class="font-bold">Auto-Eliminate Participants</p>
                                <input type="checkbox" x-model="adminSettings.autoEliminate" @change="saveAdminSettings" class="h-4 w-4 rounded accent-indigo-600">
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="text-slate-400 text-[10px]">Max Wrong Answers:</span>
                                <input type="number" min="1" max="10" x-model.number="adminSettings.maxWrongAnswers" @change="saveAdminSettings" class="w-16 bg-slate-800 border border-slate-700 rounded p-1 text-xs">
                            </div>
                        </div>

                        <div class="bg-slate-900 p-3.5 rounded-xl border border-slate-700 flex flex-col justify-center space-y-2">
                            <button @click="resetScores" class="w-full bg-red-600/80 hover:bg-red-600 py-1.5 rounded-lg text-xs font-semibold">Reset Leaderboard & Scores</button>
                        </div>
                    </div>
                </div>

                <!-- Create & Add Question to Bank -->
                <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl space-y-4">
                    <h3 class="text-lg font-bold text-indigo-400 border-b border-slate-700 pb-2">➕ Question Builder</h3>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Question Category / Type</label>
                            <select x-model="newQ.type" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm">
                                <option value="mc">Multiple Choice</option>
                                <option value="tf">True or False</option>
                                <option value="identification">Identification (Short Answer)</option>
                                <option value="order">Ordering / Sequence</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Question Timer (Seconds)</label>
                            <input type="number" x-model.number="newQ.timer" min="5" max="300" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Question Prompt</label>
                        <input type="text" x-model="newQ.text" placeholder="Enter question..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm">
                    </div>

                    <template x-if="newQ.type === 'mc'">
                        <div class="space-y-3">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                <template x-for="(opt, i) in newQ.options" :key="i">
                                    <input type="text" x-model="newQ.options[i]" :placeholder="`Option ${i+1}`" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm">
                                </template>
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Correct Choice</label>
                                <select x-model.number="newQ.correctMc" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm">
                                    <option value="0">Option 1</option>
                                    <option value="1">Option 2</option>
                                    <option value="2">Option 3</option>
                                    <option value="3">Option 4</option>
                                </select>
                            </div>
                        </div>
                    </template>

                    <template x-if="newQ.type === 'tf'">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Correct Answer</label>
                            <select x-model="newQ.correctTf" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm">
                                <option value="True">True</option>
                                <option value="False">False</option>
                            </select>
                        </div>
                    </template>

                    <template x-if="newQ.type === 'identification'">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Valid Answers (Comma Separated)</label>
                            <input type="text" x-model="newQ.validAnswers" placeholder="e.g. Paris, paris, Capital of France" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm">
                        </div>
                    </template>

                    <template x-if="newQ.type === 'order'">
                        <div class="space-y-2">
                            <label class="block text-xs text-slate-400">Enter Items in CORRECT Sequence (1 per line):</label>
                            <textarea x-model="newQ.orderItems" rows="4" placeholder="Step 1&#10;Step 2&#10;Step 3" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm"></textarea>
                        </div>
                    </template>

                    <button @click="saveQuestionToBank" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-2.5 rounded-xl transition">Save to Question Bank</button>
                </div>

                <!-- Saved Question Bank -->
                <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                        <h3 class="text-lg font-bold text-indigo-400">📚 Question Bank</h3>
                        <button @click="clearActiveQuestion" x-show="activeQuestion" class="bg-amber-600/80 hover:bg-amber-600 text-xs px-3 py-1.5 rounded-lg font-bold transition">Stop / Clear Current Active Question</button>
                    </div>
                    
                    <div class="space-y-3">
                        <template x-for="(q, idx) in questionBank" :key="q.id">
                            <div class="bg-slate-900 border border-slate-700 p-4 rounded-xl flex justify-between items-center gap-4">
                                <div>
                                    <span class="text-[10px] uppercase font-bold text-indigo-400 bg-indigo-950 px-2 py-0.5 rounded border border-indigo-800" x-text="q.type"></span>
                                    <h4 class="font-bold text-sm mt-1" x-text="q.text"></h4>
                                    <p class="text-xs text-slate-400" x-text="`Timer: ${q.timer}s`"></p>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <button @click="publishQuestion(q)" class="bg-emerald-600 hover:bg-emerald-500 text-xs px-3 py-1.5 rounded-lg font-bold transition">Publish Now</button>
                                    <button @click="deleteQuestion(idx)" class="bg-red-600/80 hover:bg-red-600 text-xs px-2.5 py-1.5 rounded-lg transition">Delete</button>
                                </div>
                            </div>
                        </template>
                        <template x-if="questionBank.length === 0">
                            <p class="text-xs text-slate-500 text-center py-4">Question bank is empty. Add questions above.</p>
                        </template>
                    </div>
                </div>

                <!-- Live Participant Tracking Monitor -->
                <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl space-y-4">
                    <h3 class="text-lg font-bold text-indigo-400 border-b border-slate-700 pb-2">👥 Participant Stats & Monitoring</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-900 text-slate-400">
                                <tr>
                                    <th class="p-2.5">Participant Name</th>
                                    <th class="p-2.5">Score</th>
                                    <th class="p-2.5">Wrong Answers</th>
                                    <th class="p-2.5">Status</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800">
                                <template x-for="(data, name) in scores" :key="name">
                                    <tr>
                                        <td class="p-2.5 font-bold" x-text="name"></td>
                                        <td class="p-2.5 font-mono text-indigo-400" x-text="data.score"></td>
                                        <td class="p-2.5 font-mono text-red-400" x-text="data.wrongCount || 0"></td>
                                        <td class="p-2.5">
                                            <span :class="data.eliminated ? 'bg-red-950 text-red-400 border-red-800' : 'bg-emerald-950 text-emerald-400 border-emerald-800'" class="px-2 py-0.5 border rounded text-[10px] font-bold" x-text="data.eliminated ? 'Eliminated' : 'Active'"></span>
                                        </td>
                                    </tr>
                                </template>
                                <template x-if="Object.keys(scores).length === 0">
                                    <tr>
                                        <td colspan="4" class="text-center py-4 text-slate-500">No participants have joined yet.</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </template>
    </main>

    <!-- App Logic -->
    <script>
        function quizApp() {
            return {
                isAdmin: false,
                currentView: 'participant',
                participantName: localStorage.getItem('qa_participant') || '',
                tempName: '',
                
                questionBank: JSON.parse(localStorage.getItem('qa_bank') || '[]'),
                activeQuestion: JSON.parse(localStorage.getItem('qa_active') || 'null'),
                timer: parseInt(localStorage.getItem('qa_timer') || '0'),
                scores: JSON.parse(localStorage.getItem('qa_scores') || '{}'),
                correctCount: parseInt(localStorage.getItem('qa_correct_count') || '0'),

                adminSettings: JSON.parse(localStorage.getItem('qa_admin_settings') || JSON.stringify({
                    showImmediateResult: true,
                    showCountOnly: false,
                    showScoreboard: true,
                    maskNames: false,
                    maskMode: 'questionMarks',
                    autoEliminate: false,
                    maxWrongAnswers: 3
                })),

                newQ: {
                    type: 'mc',
                    text: '',
                    timer: 20,
                    options: ['', '', '', ''],
                    correctMc: 0,
                    correctTf: 'True',
                    validAnswers: '',
                    orderItems: ''
                },

                hasSubmitted: false,
                selectedMcOption: null,
                identificationInput: '',
                userOrder: [],
                lastAnswerCorrect: false,
                timerInterval: null,

                init() {
                    if (localStorage.getItem('qa_is_admin') === 'true') {
                        this.isAdmin = true;
                    }

                    // Polling data loop (every 500ms) to ensure instant synchronization of participant lists, active questions, and timers across all connected participant browsers/tabs
                    setInterval(() => {
                        let storedScores = localStorage.getItem('qa_scores');
                        if (storedScores) {
                            let parsed = JSON.parse(storedScores);
                            if (JSON.stringify(parsed) !== JSON.stringify(this.scores)) {
                                this.scores = parsed;
                            }
                        }

                        let storedActive = localStorage.getItem('qa_active');
                        let currentActiveStr = JSON.stringify(this.activeQuestion);
                        if (storedActive !== currentActiveStr) {
                            let newActive = storedActive ? JSON.parse(storedActive) : null;
                            if (JSON.stringify(newActive) !== currentActiveStr) {
                                this.activeQuestion = newActive;
                                if (this.activeQuestion) {
                                    this.resetParticipantAnswerState();
                                }
                            }
                        }

                        let storedTimer = localStorage.getItem('qa_timer');
                        if (storedTimer !== null) {
                            this.timer = parseInt(storedTimer);
                        }
                    }, 500);

                    // Countdown Timer loop for admin driver
                    this.timerInterval = setInterval(() => {
                        if (this.timer > 0) {
                            this.timer--;
                            if (this.isAdmin) {
                                localStorage.setItem('qa_timer', this.timer.toString());
                            }
                        }
                    }, 1000);

                    if (this.activeQuestion && this.activeQuestion.type === 'order') {
                        this.initOrderItems();
                    }
                },

                get isEliminated() {
                    if (!this.participantName || !this.scores[this.participantName]) return false;
                    return !!this.scores[this.participantName].eliminated;
                },

                handleLogoClick() {
                    if (this.isAdmin) {
                        this.currentView = this.currentView === 'admin' ? 'participant' : 'admin';
                        return;
                    }
                    let pwd = prompt("Enter Admin Password:");
                    if (pwd === "Edpogi") {
                        this.isAdmin = true;
                        this.currentView = 'admin';
                        localStorage.setItem('qa_is_admin', 'true');
                    } else if (pwd !== null) {
                        alert("Incorrect password.");
                    }
                },

                logoutAdmin() {
                    this.isAdmin = false;
                    this.currentView = 'participant';
                    localStorage.removeItem('qa_is_admin');
                },

                joinAsParticipant() {
                    if (!this.tempName.trim()) return alert("Please enter a valid name.");
                    this.participantName = this.tempName.trim();
                    localStorage.setItem('qa_participant', this.participantName);

                    // Pull latest scores to avoid overwriting other participants
                    let currentScores = JSON.parse(localStorage.getItem('qa_scores') || '{}');
                    if (!currentScores[this.participantName]) {
                        currentScores[this.participantName] = { score: 0, wrongCount: 0, eliminated: false };
                    }
                    this.scores = currentScores;
                    localStorage.setItem('qa_scores', JSON.stringify(this.scores));
                },

                resetParticipant() {
                    this.participantName = '';
                    localStorage.removeItem('qa_participant');
                },

                saveAdminSettings() {
                    localStorage.setItem('qa_admin_settings', JSON.stringify(this.adminSettings));
                },

                saveQuestionToBank() {
                    if (!this.newQ.text.trim()) return alert("Please enter a question prompt.");
                    
                    let q = {
                        id: Date.now(),
                        type: this.newQ.type,
                        text: this.newQ.text,
                        timer: this.newQ.timer || 20
                    };

                    if (q.type === 'mc') {
                        q.options = [...this.newQ.options];
                        q.correct = this.newQ.correctMc;
                    } else if (q.type === 'tf') {
                        q.options = ['True', 'False'];
                        q.correct = this.newQ.correctTf;
                    } else if (q.type === 'identification') {
                        q.validAnswers = this.newQ.validAnswers.split(',').map(s => s.trim().toLowerCase());
                    } else if (q.type === 'order') {
                        q.correctOrder = this.newQ.orderItems.split('\n').map(s => s.trim()).filter(s => s.length > 0);
                        if (q.correctOrder.length < 2) return alert("Please provide at least 2 items for ordering.");
                    }

                    this.questionBank.push(q);
                    localStorage.setItem('qa_bank', JSON.stringify(this.questionBank));
                    alert("Question saved to bank!");
                    this.newQ.text = '';
                },

                deleteQuestion(index) {
                    this.questionBank.splice(index, 1);
                    localStorage.setItem('qa_bank', JSON.stringify(this.questionBank));
                },

                publishQuestion(question) {
                    this.activeQuestion = question;
                    this.timer = question.timer;
                    this.correctCount = 0;
                    
                    // Immediately write to localStorage to broadcast instantly to all participants
                    localStorage.setItem('qa_active', JSON.stringify(this.activeQuestion));
                    localStorage.setItem('qa_timer', this.timer.toString());
                    localStorage.setItem('qa_correct_count', '0');
                    
                    this.resetParticipantAnswerState();
                    alert("Question published successfully to all participants!");
                },

                clearActiveQuestion() {
                    this.activeQuestion = null;
                    this.timer = 0;
                    localStorage.removeItem('qa_active');
                    localStorage.removeItem('qa_timer');
                    alert("Active question cleared.");
                },

                resetParticipantAnswerState() {
                    this.hasSubmitted = false;
                    this.selectedMcOption = null;
                    this.identificationInput = '';
                    this.initOrderItems();
                },

                initOrderItems() {
                    if (this.activeQuestion && this.activeQuestion.type === 'order') {
                        this.userOrder = [...this.activeQuestion.correctOrder].sort(() => Math.random() - 0.5);
                    }
                },

                moveOrder(index, direction) {
                    let target = index + direction;
                    if (target < 0 || target >= this.userOrder.length) return;
                    let temp = this.userOrder[index];
                    this.userOrder[index] = this.userOrder[target];
                    this.userOrder[target] = temp;
                },

                selectMcOption(idx) {
                    if (this.hasSubmitted || this.timer <= 0) return;
                    this.selectedMcOption = idx;
                },

                submitAnswer() {
                    if (this.hasSubmitted || this.timer <= 0) return;

                    let isCorrect = false;

                    if (this.activeQuestion.type === 'mc') {
                        isCorrect = (this.selectedMcOption === this.activeQuestion.correct);
                    } else if (this.activeQuestion.type === 'tf') {
                        isCorrect = (this.activeQuestion.options[this.selectedMcOption] === this.activeQuestion.correct);
                    } else if (this.activeQuestion.type === 'identification') {
                        let cleanInput = this.identificationInput.trim().toLowerCase();
                        isCorrect = this.activeQuestion.validAnswers.includes(cleanInput);
                    } else if (this.activeQuestion.type === 'order') {
                        isCorrect = JSON.stringify(this.userOrder) === JSON.stringify(this.activeQuestion.correctOrder);
                    }

                    this.hasSubmitted = true;
                    this.lastAnswerCorrect = isCorrect;

                    // Fetch current scores from storage to merge safely
                    let currentScores = JSON.parse(localStorage.getItem('qa_scores') || '{}');
                    if (!currentScores[this.participantName]) {
                        currentScores[this.participantName] = { score: 0, wrongCount: 0, eliminated: false };
                    }

                    let pData = currentScores[this.participantName];

                    if (isCorrect) {
                        pData.score += 10;
                        this.correctCount++;
                        localStorage.setItem('qa_correct_count', this.correctCount.toString());
                    } else {
                        pData.wrongCount = (pData.wrongCount || 0) + 1;
                        if (this.adminSettings.autoEliminate && pData.wrongCount >= this.adminSettings.maxWrongAnswers) {
                            pData.eliminated = true;
                        }
                    }

                    this.scores = currentScores;
                    localStorage.setItem('qa_scores', JSON.stringify(this.scores));
                },

                resetScores() {
                    if (confirm("Reset all leaderboard scores and participant statuses?")) {
                        this.scores = {};
                        localStorage.setItem('qa_scores', JSON.stringify(this.scores));
                    }
                },

                formatName(name) {
                    if (!this.adminSettings.maskNames || this.isAdmin) return name;

                    let mode = this.adminSettings.maskMode;
                    if (mode === 'questionMarks') return '??';
                    if (mode === 'initial') return name.charAt(0) + '***';
                    if (mode === 'firstTwo') return name.length > 2 ? name.substring(0, 2) + '***' : name;
                    if (mode === 'lengthOnly') return `[${name.length} Letters]`;
                    return '??';
                }
            }
        }
    </script>
